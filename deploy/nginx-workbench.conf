# nginx reverse proxy: https://phayaohospital.moph.go.th/workbench/  →  Next.js (next start) ที่พอร์ต 5005
#
# ฝั่ง Next (.env ก่อน `bun run build`):
#   NEXT_PUBLIC_BASE_PATH=/workbench
#
# วาง location สองบล็อกนี้ใน server { } ของ phayaohospital.moph.go.th ที่มีอยู่แล้ว
# (ข้างเดียวกับ /due) — แก้ 127.0.0.1 เป็น IP เครื่องที่รันแอปถ้าอยู่คนละเครื่องกับ nginx
#
# ส่งต่อ path ทั้งเส้น (/workbench/...) ไปให้ Next — proxy_pass ห้ามมี path/สแลชต่อท้าย
# ไม่งั้น nginx ตัด /workbench ออกแล้ว Next หาหน้าไม่เจอ (ตอบ 404 ทุกหน้า)

upstream workbench_next {
    server 127.0.0.1:5005;
    keepalive 16;
}

# --- ใส่ใน server { listen 443 ssl; server_name phayaohospital.moph.go.th; ... } ---

# /workbench/ (มีสแลชท้าย) Next เด้งไป /workbench ให้เอง ไม่ต้องเขียนกฎเพิ่ม
location /workbench {
    proxy_pass http://workbench_next;
    proxy_http_version 1.1;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    # คุกกี้เข้าระบบตั้ง Secure ตาม header นี้ (lib/auth/session.ts) — ต้องส่ง https มาให้
    proxy_set_header X-Forwarded-Proto $scheme;
    # ร่องรอยการใช้งานและ rate limit อ่าน IP ผู้ใช้จากสองตัวนี้ ไม่ส่ง = ได้ IP ของ nginx ทุกแถว
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Connection        "";

    # ใบรายงานตรวจสุขภาพ (PDF) และรายงาน RDU ช่วงยาวบางครั้งเกิน 60 วินาที
    proxy_read_timeout 120s;
    # หน้าแบบ streaming (Suspense) ต้องส่งทันที ไม่ให้ nginx พักไว้
    proxy_buffering off;
}

# ไฟล์ build ตั้งชื่อตาม hash — แคชได้นาน
location /workbench/_next/static/ {
    proxy_pass http://workbench_next;
    proxy_set_header Host $http_host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
